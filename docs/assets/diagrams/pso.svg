<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="pso-arrow-global" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
    <marker id="pso-arrow-personal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0ea5e9"/>
    </marker>
    <marker id="pso-arrow-vel" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="pso-arrow-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="300" rx="10"/>
    <rect x="360" y="20" width="280" height="300" rx="10"/>
    <rect x="700" y="20" width="280" height="300" rx="10"/>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="380" cy="40" r="12" fill="#0ea5e9"/><text x="380" y="45" text-anchor="middle">2</text>
    <circle cx="720" cy="40" r="12" fill="#0ea5e9"/><text x="720" y="45" text-anchor="middle">3</text>
  </g>

  <!-- inter-panel arrows -->
  <line x1="300" y1="170" x2="358" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#pso-arrow-step)"/>
  <line x1="640" y1="170" x2="698" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#pso-arrow-step)"/>

  <!-- ============ Panel 1: scatter + evaluate ============ -->
  <g>
    <path d="M255 75 l5 12 13 2 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -2 z" fill="#f59e0b"/>
    <circle cx="80" cy="100" r="6" fill="#0ea5e9"/>
    <circle cx="140" cy="200" r="6" fill="#0ea5e9"/>
    <circle cx="200" cy="90" r="6" fill="#0ea5e9"/>
    <circle cx="100" cy="250" r="6" fill="#0ea5e9"/>
    <circle cx="230" cy="220" r="6" fill="#0ea5e9"/>
    <circle cx="60" cy="180" r="6" fill="#0ea5e9"/>
    <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Scatter particles randomly,</text>
    <text x="160" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">evaluate each one's fitness</text>
  </g>

  <!-- ============ Panel 2: velocity update ============ -->
  <g>
    <path d="M595 75 l5 12 13 2 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -2 z" fill="#f59e0b"/>
    <rect x="425" y="215" width="9" height="9" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="480" y1="170" x2="433" y2="213" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#pso-arrow-personal)"/>
    <line x1="480" y1="170" x2="590" y2="88" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#pso-arrow-global)"/>
    <line x1="480" y1="170" x2="525" y2="145" stroke="#6b7280" stroke-width="2.5" marker-end="url(#pso-arrow-vel)"/>
    <circle cx="480" cy="170" r="7" fill="#0ea5e9"/>
    <text x="500" y="195" font-size="12" fill="#6b7280">v = inertia + pull to</text>
    <text x="500" y="210" font-size="12" fill="#6b7280">personal + global best</text>
    <text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Update each particle's</text>
    <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">velocity, then move it</text>
  </g>

  <!-- ============ Panel 3: converge + repeat ============ -->
  <g>
    <path d="M935 90 l5 12 13 2 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -2 z" fill="#f59e0b"/>
    <circle cx="880" cy="115" r="6" fill="#0ea5e9"/>
    <circle cx="895" cy="150" r="6" fill="#0ea5e9"/>
    <circle cx="860" cy="150" r="6" fill="#0ea5e9"/>
    <circle cx="905" cy="120" r="6" fill="#0ea5e9"/>
    <circle cx="870" cy="130" r="6" fill="#0ea5e9"/>
    <circle cx="915" cy="140" r="6" fill="#0ea5e9"/>
    <text x="840" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Swarm tightens around the</text>
    <text x="840" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">global best each iteration</text>
  </g>

  <!-- repeat loop -->
  <path d="M700 350 C 550 400, 450 400, 300 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#pso-arrow-step)"/>
  <text x="500" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 2 – 3 for n_iterations</text>
</svg>
