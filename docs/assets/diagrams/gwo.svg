<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="gwo-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
    <marker id="gwo-pull" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="300" rx="10"/>
    <rect x="360" y="20" width="280" height="300" rx="10"/>
    <rect x="700" y="20" width="280" height="300" rx="10"/>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="380" cy="40" r="12" fill="#0ea5e9"/><text x="380" y="45" text-anchor="middle">2</text>
    <circle cx="720" cy="40" r="12" fill="#0ea5e9"/><text x="720" y="45" text-anchor="middle">3</text>
  </g>

  <!-- inter-panel arrows -->
  <line x1="300" y1="170" x2="358" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#gwo-step)"/>
  <line x1="640" y1="170" x2="698" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#gwo-step)"/>

  <!-- ============ Panel 1: scatter + rank ============ -->
  <g>
    <circle cx="90" cy="100" r="6" fill="#a5f3fc"/>
    <circle cx="150" cy="230" r="6" fill="#a5f3fc"/>
    <circle cx="230" cy="90" r="6" fill="#a5f3fc"/>
    <circle cx="80" cy="220" r="6" fill="#a5f3fc"/>
    <circle cx="200" cy="200" r="6" fill="#a5f3fc"/>
    <circle cx="60" cy="150" r="7" fill="#0c4a6e"/>
    <text x="60" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">α</text>
    <circle cx="140" cy="120" r="7" fill="#0ea5e9"/>
    <text x="140" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#0ea5e9">β</text>
    <circle cx="220" cy="160" r="7" fill="#67e8f9"/>
    <text x="220" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#67e8f9">δ</text>
    <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Scatter the pack; rank the</text>
    <text x="160" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">3 fittest as α, β, δ</text>
  </g>

  <!-- ============ Panel 2: encircle each leader ============ -->
  <g>
    <circle cx="400" cy="170" r="7" fill="#0c4a6e"/>
    <text x="400" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">α</text>
    <circle cx="480" cy="110" r="7" fill="#0ea5e9"/>
    <text x="480" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#0ea5e9">β</text>
    <circle cx="560" cy="180" r="7" fill="#67e8f9"/>
    <text x="560" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#67e8f9">δ</text>
    <circle cx="470" cy="230" r="6" fill="#a5f3fc"/>
    <line x1="470" y1="230" x2="405" y2="178" stroke="#0c4a6e" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#gwo-pull)"/>
    <line x1="470" y1="230" x2="483" y2="118" stroke="#0ea5e9" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#gwo-pull)"/>
    <line x1="470" y1="230" x2="555" y2="185" stroke="#67e8f9" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#gwo-pull)"/>
    <text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Every wolf computes a pull</text>
    <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">toward α, β, and δ separately</text>
  </g>

  <!-- ============ Panel 3: average + shrink ============ -->
  <g>
    <circle cx="795" cy="150" r="7" fill="#0c4a6e"/>
    <text x="795" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">α</text>
    <circle cx="850" cy="120" r="7" fill="#0ea5e9"/>
    <text x="850" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#0ea5e9">β</text>
    <circle cx="880" cy="165" r="7" fill="#67e8f9"/>
    <text x="880" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#67e8f9">δ</text>
    <circle cx="825" cy="215" r="6" fill="#a5f3fc"/>
    <line x1="825" y1="215" x2="835" y2="150" stroke="#6b7280" stroke-width="2.5" marker-end="url(#gwo-pull)"/>
    <text x="900" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Move to the average of the</text>
    <text x="900" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">three pulls; radius `a` shrinks</text>
  </g>

  <!-- repeat loop -->
  <path d="M700 350 C 550 400, 450 400, 300 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#gwo-step)"/>
  <text x="500" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 3 for n_iterations, re-ranking α/β/δ each time</text>
</svg>
