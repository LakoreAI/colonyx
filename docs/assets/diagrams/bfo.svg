<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="bfo-move" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0ea5e9"/>
    </marker>
    <marker id="bfo-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="300" rx="10"/>
    <rect x="360" y="20" width="280" height="300" rx="10"/>
    <rect x="700" y="20" width="280" height="300" rx="10"/>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="380" cy="40" r="12" fill="#0ea5e9"/><text x="380" y="45" text-anchor="middle">2</text>
    <circle cx="720" cy="40" r="12" fill="#0ea5e9"/><text x="720" y="45" text-anchor="middle">3</text>
  </g>

  <!-- inline nesting-count badges (innermost loops) -->
  <g font-size="11" fill="#6b7280">
    <text x="260" y="34" text-anchor="end">× n_chemotactic_steps</text>
    <text x="600" y="34" text-anchor="end">× n_reproduction_steps</text>
  </g>

  <!-- inter-panel arrows -->
  <line x1="300" y1="170" x2="358" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#bfo-step)"/>
  <line x1="640" y1="170" x2="698" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#bfo-step)"/>

  <!-- ============ Panel 1: chemotaxis (innermost) ============ -->
  <g>
    <circle cx="120" cy="170" r="7" fill="#0ea5e9"/>
    <line x1="120" y1="170" x2="175" y2="140" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#bfo-move)"/>
    <circle cx="175" cy="140" r="7" fill="#0ea5e9" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Each bacterium tumbles a step;</text>
    <text x="160" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">keeps it only if it improves</text>
  </g>

  <!-- ============ Panel 2: reproduction (middle) ============ -->
  <g>
    <circle cx="420" cy="150" r="7" fill="#0ea5e9"/>
    <circle cx="450" cy="150" r="7" fill="#0ea5e9"/>
    <circle cx="480" cy="180" r="6" fill="#c9cdd3"/>
    <circle cx="510" cy="180" r="6" fill="#c9cdd3"/>
    <line x1="465" y1="150" x2="540" y2="150" stroke="#9ca3af" stroke-width="1.6" marker-end="url(#bfo-move)"/>
    <circle cx="560" cy="150" r="7" fill="#0ea5e9"/>
    <circle cx="585" cy="150" r="7" fill="#0ea5e9"/>
    <text x="500" y="215" text-anchor="middle" font-size="11" fill="#6b7280">fitter half replicated to refill</text>
    <text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Sort by fitness, drop the</text>
    <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">weaker half, replicate the rest</text>
  </g>

  <!-- ============ Panel 3: elimination-dispersal (outermost) ============ -->
  <g>
    <path d="M935 90 l5 12 13 2 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -2 z" fill="#f59e0b"/>
    <circle cx="850" cy="170" r="6" fill="#0ea5e9"/>
    <circle cx="880" cy="200" r="6" fill="#0ea5e9"/>
    <circle cx="800" cy="200" r="6" fill="#0ea5e9"/>
    <circle cx="820" cy="140" r="6" fill="#0ea5e9"/>
    <line x1="820" y1="140" x2="895" y2="230" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#bfo-move)"/>
    <circle cx="895" cy="230" r="6" fill="#0ea5e9" opacity="0.6"/>
    <text x="840" y="270" text-anchor="middle" font-size="11" fill="#6b7280">random reset, probability p_ed</text>
    <text x="840" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Each bacterium may be reset</text>
    <text x="840" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">to a fresh random position</text>
  </g>

  <!-- repeat loop -->
  <path d="M700 350 C 550 400, 450 400, 300 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#bfo-step)"/>
  <text x="500" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 3 for n_iterations (elimination-dispersal rounds)</text>
</svg>
