<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="nsga-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
    <marker id="nsga-flow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="220" height="300" rx="10"/>
    <rect x="260" y="20" width="220" height="300" rx="10"/>
    <rect x="500" y="20" width="220" height="300" rx="10"/>
    <rect x="740" y="20" width="220" height="300" rx="10"/>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="280" cy="40" r="12" fill="#0ea5e9"/><text x="280" y="45" text-anchor="middle">2</text>
    <circle cx="520" cy="40" r="12" fill="#0ea5e9"/><text x="520" y="45" text-anchor="middle">3</text>
    <circle cx="760" cy="40" r="12" fill="#0ea5e9"/><text x="760" y="45" text-anchor="middle">4</text>
  </g>

  <!-- inter-panel arrows -->
  <line x1="240" y1="170" x2="258" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#nsga-step)"/>
  <line x1="480" y1="170" x2="498" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#nsga-step)"/>
  <line x1="720" y1="170" x2="738" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#nsga-step)"/>

  <!-- ============ Panel 1: non-dominated sort + crowding ============ -->
  <g>
    <circle cx="70" cy="150" r="6" fill="#f59e0b"/>
    <circle cx="105" cy="110" r="6" fill="#f59e0b"/>
    <circle cx="150" cy="90" r="6" fill="#f59e0b"/>
    <circle cx="90" cy="180" r="5.5" fill="#67e8f9"/>
    <circle cx="140" cy="150" r="5.5" fill="#67e8f9"/>
    <circle cx="180" cy="130" r="5.5" fill="#67e8f9"/>
    <circle cx="110" cy="230" r="5" fill="#a5f3fc"/>
    <circle cx="160" cy="210" r="5" fill="#a5f3fc"/>
    <circle cx="200" cy="240" r="5" fill="#a5f3fc"/>
  </g>
  <text x="130" y="280" text-anchor="middle" font-size="11.5" fill="#6b7280">Rank into fronts —</text>
  <text x="130" y="296" text-anchor="middle" font-size="11.5" fill="#6b7280">amber = front 0</text>

  <!-- ============ Panel 2: tournament select + crossover/mutate ============ -->
  <g>
    <circle cx="300" cy="110" r="6" fill="#f59e0b"/>
    <text x="300" y="95" text-anchor="middle" font-size="10.5" fill="#6b7280">parent A</text>
    <circle cx="300" cy="220" r="5.5" fill="#67e8f9"/>
    <text x="300" y="242" text-anchor="middle" font-size="10.5" fill="#6b7280">parent B</text>
    <line x1="312" y1="120" x2="370" y2="155" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#nsga-flow)"/>
    <line x1="312" y1="210" x2="370" y2="175" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#nsga-flow)"/>
    <circle cx="385" cy="165" r="6" fill="#0ea5e9"/>
    <text x="385" y="145" text-anchor="middle" font-size="10.5" fill="#0ea5e9">child</text>
  </g>
  <text x="370" y="280" text-anchor="middle" font-size="11.5" fill="#6b7280">Tournament-select by rank,</text>
  <text x="370" y="296" text-anchor="middle" font-size="11.5" fill="#6b7280">then crowding; blend + mutate</text>

  <!-- ============ Panel 3: combine + truncate ============ -->
  <g>
    <circle cx="560" cy="90" r="6" fill="#f59e0b"/>
    <circle cx="590" cy="105" r="6" fill="#f59e0b"/>
    <circle cx="620" cy="95" r="6" fill="#f59e0b"/>
    <circle cx="555" cy="150" r="5.5" fill="#67e8f9"/>
    <circle cx="600" cy="160" r="5.5" fill="#67e8f9"/>
    <circle cx="565" cy="200" r="5" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="615" cy="210" r="5" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="640" cy="180" r="5" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  </g>
  <text x="600" y="280" text-anchor="middle" font-size="11.5" fill="#6b7280">Combine + re-sort; fill by</text>
  <text x="600" y="296" text-anchor="middle" font-size="11.5" fill="#6b7280">front, cutting sparsest last</text>

  <!-- ============ Panel 4: next generation ============ -->
  <g>
    <circle cx="800" cy="110" r="6" fill="#f59e0b"/>
    <circle cx="835" cy="95" r="6" fill="#f59e0b"/>
    <circle cx="870" cy="115" r="6" fill="#f59e0b"/>
    <circle cx="810" cy="160" r="5.5" fill="#67e8f9"/>
    <circle cx="855" cy="155" r="5.5" fill="#67e8f9"/>
    <circle cx="825" cy="200" r="5" fill="#a5f3fc"/>
  </g>
  <text x="840" y="280" text-anchor="middle" font-size="11.5" fill="#6b7280">Next generation; repeat</text>
  <text x="840" y="296" text-anchor="middle" font-size="11.5" fill="#6b7280">until n_iterations</text>

  <!-- repeat loop -->
  <path d="M740 350 C 550 400, 350 400, 240 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#nsga-step)"/>
  <text x="490" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 4 for n_iterations</text>
</svg>
