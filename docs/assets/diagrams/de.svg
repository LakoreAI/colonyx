<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="de-diff" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="de-mut" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0ea5e9"/>
    </marker>
    <marker id="de-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="300" rx="10"/>
    <rect x="360" y="20" width="280" height="300" rx="10"/>
    <rect x="700" y="20" width="280" height="300" rx="10"/>
  </g>

  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="380" cy="40" r="12" fill="#0ea5e9"/><text x="380" y="45" text-anchor="middle">2</text>
    <circle cx="720" cy="40" r="12" fill="#0ea5e9"/><text x="720" y="45" text-anchor="middle">3</text>
  </g>

  <line x1="300" y1="170" x2="358" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#de-step)"/>
  <line x1="640" y1="170" x2="698" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#de-step)"/>

  <!-- ============ Panel 1: mutate ============ -->
  <g>
    <circle cx="70" cy="90" r="5" fill="#c9cdd3"/>
    <circle cx="240" cy="100" r="5" fill="#c9cdd3"/>
    <circle cx="90" cy="240" r="5" fill="#c9cdd3"/>
    <circle cx="230" cy="235" r="5" fill="#c9cdd3"/>
    <circle cx="90" cy="120" r="7" fill="#0ea5e9"/>
    <text x="90" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#0ea5e9">a</text>
    <circle cx="215" cy="150" r="7" fill="#0ea5e9"/>
    <text x="230" y="150" font-size="12" font-weight="700" fill="#0ea5e9">b</text>
    <circle cx="140" cy="205" r="7" fill="#0ea5e9"/>
    <text x="140" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#0ea5e9">c</text>
    <line x1="140" y1="205" x2="215" y2="150" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#de-diff)"/>
    <line x1="90" y1="120" x2="165" y2="65" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#de-mut)"/>
    <rect x="160" y="58" width="12" height="12" fill="#0ea5e9" transform="rotate(45 166 64)"/>
    <text x="182" y="68" font-size="12" fill="#0ea5e9">v</text>
    <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Pick a, b, c; form mutant</text>
    <text x="160" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">v = a + f · (b − c)</text>
  </g>

  <!-- ============ Panel 2: crossover ============ -->
  <g>
    <rect x="420" y="80" width="9" height="9" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="405" y="88" text-anchor="end" font-size="12" fill="#6b7280">target x</text>
    <circle cx="420" cy="140" r="6" fill="#0ea5e9"/>
    <text x="405" y="145" text-anchor="end" font-size="12" fill="#0ea5e9">mutant v</text>

    <!-- dimension tick boxes: gray = from target, cyan = from mutant -->
    <g>
      <rect x="410" y="195" width="30" height="26" fill="#c9cdd3"/>
      <rect x="440" y="195" width="30" height="26" fill="#0ea5e9"/>
      <rect x="470" y="195" width="30" height="26" fill="#c9cdd3"/>
      <rect x="500" y="195" width="30" height="26" fill="#0ea5e9" stroke="#f59e0b" stroke-width="3"/>
      <rect x="530" y="195" width="30" height="26" fill="#c9cdd3"/>
      <text x="515" y="238" text-anchor="middle" font-size="10.5" fill="#9ca3af">forced dim j</text>
    </g>
    <text x="500" y="270" text-anchor="middle" font-size="12" fill="#6b7280">trial u = mix of x and v</text>
    <text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Each dimension copies from v</text>
    <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">with prob cr (dim j forced)</text>
  </g>

  <!-- ============ Panel 3: select + repeat ============ -->
  <g>
    <rect x="820" y="130" width="9" height="9" fill="none" stroke="#c9cdd3" stroke-width="2"/>
    <text x="835" y="138" font-size="12" fill="#c9cdd3">target x (discarded)</text>
    <circle cx="820" cy="170" r="8" fill="#f59e0b"/>
    <text x="835" y="175" font-size="12" fill="#f59e0b" font-weight="600">trial u (accepted)</text>
    <line x1="824" y1="134" x2="820" y2="163" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#de-step)"/>
    <text x="840" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">u replaces x immediately if</text>
    <text x="840" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">score(u) ≤ score(x)</text>
  </g>

  <path d="M700 350 C 550 400, 450 400, 300 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#de-step)"/>
  <text x="500" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 3 for every individual, every iteration</text>
</svg>
