<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="aco-ant" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0ea5e9"/>
    </marker>
    <marker id="aco-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="300" rx="10"/>
    <rect x="360" y="20" width="280" height="300" rx="10"/>
    <rect x="700" y="20" width="280" height="300" rx="10"/>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="380" cy="40" r="12" fill="#0ea5e9"/><text x="380" y="45" text-anchor="middle">2</text>
    <circle cx="720" cy="40" r="12" fill="#0ea5e9"/><text x="720" y="45" text-anchor="middle">3</text>
  </g>

  <!-- inter-panel arrows -->
  <line x1="300" y1="170" x2="358" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#aco-step)"/>
  <line x1="640" y1="170" x2="698" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#aco-step)"/>

  <!-- ============ Panel 1: construct tours ============ -->
  <g>
    <circle cx="55" cy="170" r="20" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="55" y="212" text-anchor="middle" font-size="12" fill="#6b7280">nest</text>
    <circle cx="255" cy="170" r="20" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="255" y="212" text-anchor="middle" font-size="12" fill="#6b7280">food</text>
    <path d="M75 158 Q 155 100 235 158" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <path d="M75 185 Q 155 245 235 185" fill="none" stroke="#9ca3af" stroke-width="2"/>
    <path d="M110 133 L 150 118" stroke="#0ea5e9" stroke-width="2.2" marker-end="url(#aco-ant)"/>
    <path d="M110 213 L 150 228" stroke="#0ea5e9" stroke-width="2.2" marker-end="url(#aco-ant)"/>
    <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Each ant builds a tour, biased</text>
    <text x="160" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">by pheromone and distance</text>
  </g>

  <!-- ============ Panel 2: evaluate + evaporate ============ -->
  <g>
    <circle cx="395" cy="170" r="20" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="395" y="212" text-anchor="middle" font-size="12" fill="#6b7280">nest</text>
    <circle cx="595" cy="170" r="20" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="595" y="212" text-anchor="middle" font-size="12" fill="#6b7280">food</text>
    <path d="M415 158 Q 495 100 575 158" fill="none" stroke="#c9cdd3" stroke-width="2"/>
    <text x="495" y="90" text-anchor="middle" font-size="11" fill="#9ca3af">L = 4</text>
    <path d="M415 185 Q 495 245 575 185" fill="none" stroke="#c9cdd3" stroke-width="2"/>
    <text x="495" y="265" text-anchor="middle" font-size="11" fill="#9ca3af">L = 9</text>
    <text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Score each tour's length;</text>
    <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">every trail evaporates a little</text>
  </g>

  <!-- ============ Panel 3: deposit + repeat ============ -->
  <g>
    <circle cx="735" cy="170" r="20" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="735" y="212" text-anchor="middle" font-size="12" fill="#6b7280">nest</text>
    <circle cx="935" cy="170" r="20" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="935" y="212" text-anchor="middle" font-size="12" fill="#6b7280">food</text>
    <path d="M755 158 Q 835 100 915 158" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <path d="M755 185 Q 835 245 915 185" fill="none" stroke="#c9cdd3" stroke-width="1.5" opacity="0.5"/>
    <text x="840" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Shorter tours deposit more —</text>
    <text x="840" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">the shortest edge thickens fastest</text>
  </g>

  <!-- repeat loop -->
  <path d="M700 350 C 550 400, 450 400, 300 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#aco-step)"/>
  <text x="500" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 3 for n_iterations</text>
</svg>
