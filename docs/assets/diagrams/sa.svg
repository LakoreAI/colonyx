<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 430" width="1340" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="sa-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
    <marker id="sa-move" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="300" rx="10"/>
    <rect x="360" y="20" width="280" height="300" rx="10"/>
    <rect x="700" y="20" width="280" height="300" rx="10"/>
    <rect x="1040" y="20" width="280" height="300" rx="10"/>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="380" cy="40" r="12" fill="#0ea5e9"/><text x="380" y="45" text-anchor="middle">2</text>
    <circle cx="720" cy="40" r="12" fill="#0ea5e9"/><text x="720" y="45" text-anchor="middle">3</text>
    <circle cx="1060" cy="40" r="12" fill="#0ea5e9"/><text x="1060" y="45" text-anchor="middle">4</text>
  </g>

  <!-- inter-panel arrows -->
  <line x1="300" y1="170" x2="358" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#sa-step)"/>
  <line x1="640" y1="170" x2="698" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#sa-step)"/>
  <line x1="980" y1="170" x2="1038" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#sa-step)"/>

  <!-- ============ Panel 1: propose a random step ============ -->
  <g>
    <circle cx="110" cy="180" r="8" fill="#0ea5e9"/>
    <text x="110" y="205" text-anchor="middle" font-size="11" fill="#6b7280">current</text>
    <circle cx="190" cy="120" r="7" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="2 2"/>
    <text x="190" y="103" text-anchor="middle" font-size="11" fill="#0ea5e9">candidate</text>
    <line x1="118" y1="173" x2="182" y2="126" stroke="#0ea5e9" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#sa-move)"/>
    <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Propose one random step</text>
    <text x="160" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">from the current solution</text>
  </g>

  <!-- ============ Panel 2: Metropolis accept/reject ============ -->
  <g>
    <text x="500" y="120" text-anchor="middle" font-size="15" font-style="italic" fill="#6b7280">P(accept) = 1 if Δ ≤ 0</text>
    <text x="500" y="145" text-anchor="middle" font-size="15" font-style="italic" fill="#6b7280">else exp(−Δ/T)</text>
    <circle cx="460" cy="210" r="7" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="2 2"/>
    <path d="M470 205 Q 500 185 528 200" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#sa-move)"/>
    <circle cx="540" cy="205" r="8" fill="#0ea5e9"/>
    <text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Accept if better — or worse</text>
    <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">with probability exp(−Δ/T)</text>
  </g>

  <!-- ============ Panel 3: cool + track best ============ -->
  <g>
    <circle cx="880" cy="200" r="8" fill="#0ea5e9"/>
    <text x="880" y="225" text-anchor="middle" font-size="11" fill="#6b7280">current</text>
    <circle cx="820" cy="130" r="9" fill="#f59e0b"/>
    <text x="820" y="113" text-anchor="middle" font-size="11" fill="#f59e0b">best-ever</text>
    <text x="840" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">T ← T × cooling_rate;</text>
    <text x="840" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">update best-ever if improved</text>
  </g>

  <!-- ============ Panel 4: cooled acceptance settles near best + repeat ============ -->
  <g>
    <circle cx="1110" cy="220" r="4" fill="#0ea5e9" opacity="0.5"/>
    <circle cx="1140" cy="195" r="4" fill="#0ea5e9" opacity="0.65"/>
    <circle cx="1165" cy="165" r="4" fill="#0ea5e9" opacity="0.8"/>
    <circle cx="1185" cy="145" r="6" fill="#0ea5e9"/>
    <path d="M1110 220 Q 1150 190 1185 145" fill="none" stroke="#0ea5e9" stroke-width="1.3" stroke-dasharray="2 3"/>
    <circle cx="1200" cy="130" r="9" fill="#f59e0b"/>
    <text x="1180" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Step size stays fixed, but low T</text>
    <text x="1180" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">rejects worse moves; walk settles</text>
  </g>

  <!-- repeat loop -->
  <path d="M1180 350 C 900 405, 400 405, 160 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#sa-step)"/>
  <text x="670" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 4 for n_iterations</text>
</svg>
