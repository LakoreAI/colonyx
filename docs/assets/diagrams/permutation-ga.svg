<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" width="1300" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="pga-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
    <marker id="pga-swap" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="270" height="300" rx="10"/>
    <rect x="310" y="20" width="270" height="300" rx="10"/>
    <rect x="600" y="20" width="270" height="300" rx="10"/>
    <rect x="890" y="20" width="270" height="300" rx="10"/>
  </g>

  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="330" cy="40" r="12" fill="#0ea5e9"/><text x="330" y="45" text-anchor="middle">2</text>
    <circle cx="620" cy="40" r="12" fill="#0ea5e9"/><text x="620" y="45" text-anchor="middle">3</text>
    <circle cx="910" cy="40" r="12" fill="#0ea5e9"/><text x="910" y="45" text-anchor="middle">4</text>
  </g>

  <line x1="290" y1="170" x2="308" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#pga-step)"/>
  <line x1="580" y1="170" x2="598" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#pga-step)"/>
  <line x1="870" y1="170" x2="888" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#pga-step)"/>

  <!-- ============ Panel 1: rank + elitism ============ -->
  <g font-size="12" fill="#ffffff" font-weight="600">
    <text x="60" y="105" font-size="11" fill="#9ca3af" font-weight="400">L=9</text>
    <rect x="90" y="90" width="22" height="22" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/><text x="101" y="105" text-anchor="middle">2</text>
    <rect x="114" y="90" width="22" height="22" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/><text x="125" y="105" text-anchor="middle">0</text>
    <rect x="138" y="90" width="22" height="22" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/><text x="149" y="105" text-anchor="middle">3</text>
    <rect x="162" y="90" width="22" height="22" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/><text x="173" y="105" text-anchor="middle">1</text>
    <text x="195" y="105" font-size="11" fill="#f59e0b" font-weight="600">best</text>

    <text x="60" y="150" font-size="11" fill="#9ca3af" font-weight="400">L=14</text>
    <rect x="90" y="135" width="22" height="22" fill="#0ea5e9"/><text x="101" y="150" text-anchor="middle">0</text>
    <rect x="114" y="135" width="22" height="22" fill="#0ea5e9"/><text x="125" y="150" text-anchor="middle">3</text>
    <rect x="138" y="135" width="22" height="22" fill="#0ea5e9"/><text x="149" y="150" text-anchor="middle">2</text>
    <rect x="162" y="135" width="22" height="22" fill="#0ea5e9"/><text x="173" y="150" text-anchor="middle">1</text>

    <text x="60" y="195" font-size="11" fill="#9ca3af" font-weight="400">L=20</text>
    <rect x="90" y="180" width="22" height="22" fill="#c9cdd3"/><text x="101" y="195" text-anchor="middle" fill="#6b7280">1</text>
    <rect x="114" y="180" width="22" height="22" fill="#c9cdd3"/><text x="125" y="195" text-anchor="middle" fill="#6b7280">2</text>
    <rect x="138" y="180" width="22" height="22" fill="#c9cdd3"/><text x="149" y="195" text-anchor="middle" fill="#6b7280">3</text>
    <rect x="162" y="180" width="22" height="22" fill="#c9cdd3"/><text x="173" y="195" text-anchor="middle" fill="#6b7280">0</text>
  </g>
  <text x="155" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Sort by tour length; the best</text>
  <text x="155" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">tour carries over unchanged</text>

  <!-- ============ Panel 2: tournament + order crossover ============ -->
  <g font-size="12" fill="#ffffff" font-weight="600">
    <text x="330" y="105" text-anchor="middle" font-size="11" fill="#9ca3af" font-weight="400">parent A</text>
    <rect x="365" y="90" width="22" height="22" fill="#0ea5e9"/><text x="376" y="105" text-anchor="middle">2</text>
    <rect x="389" y="90" width="22" height="22" fill="#0ea5e9" stroke="#f59e0b" stroke-width="3"/><text x="400" y="105" text-anchor="middle">0</text>
    <rect x="413" y="90" width="22" height="22" fill="#0ea5e9" stroke="#f59e0b" stroke-width="3"/><text x="424" y="105" text-anchor="middle">3</text>
    <rect x="437" y="90" width="22" height="22" fill="#0ea5e9"/><text x="448" y="105" text-anchor="middle">1</text>

    <text x="330" y="150" text-anchor="middle" font-size="11" fill="#9ca3af" font-weight="400">parent B</text>
    <rect x="365" y="135" width="22" height="22" fill="#67e8f9"/><text x="376" y="150" text-anchor="middle">1</text>
    <rect x="389" y="135" width="22" height="22" fill="#67e8f9"/><text x="400" y="150" text-anchor="middle">3</text>
    <rect x="413" y="135" width="22" height="22" fill="#67e8f9"/><text x="424" y="150" text-anchor="middle">0</text>
    <rect x="437" y="135" width="22" height="22" fill="#67e8f9"/><text x="448" y="150" text-anchor="middle">2</text>

    <text x="330" y="220" text-anchor="middle" font-size="11" fill="#9ca3af" font-weight="400">child</text>
    <rect x="365" y="205" width="22" height="22" fill="#67e8f9"/><text x="376" y="220" text-anchor="middle">1</text>
    <rect x="389" y="205" width="22" height="22" fill="#0ea5e9" stroke="#f59e0b" stroke-width="3"/><text x="400" y="220" text-anchor="middle">0</text>
    <rect x="413" y="205" width="22" height="22" fill="#0ea5e9" stroke="#f59e0b" stroke-width="3"/><text x="424" y="220" text-anchor="middle">3</text>
    <rect x="437" y="205" width="22" height="22" fill="#67e8f9"/><text x="448" y="220" text-anchor="middle">2</text>
  </g>
  <text x="445" y="255" text-anchor="middle" font-size="10" fill="#f59e0b">outlined slice from A; rest from B's order</text>
  <text x="445" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Tournament-pick 2 parents; order</text>
  <text x="445" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">crossover builds the child</text>

  <!-- ============ Panel 3: swap mutation ============ -->
  <g font-size="12" fill="#ffffff" font-weight="600">
    <rect x="680" y="140" width="22" height="22" fill="#67e8f9"/><text x="691" y="155" text-anchor="middle">1</text>
    <rect x="704" y="140" width="22" height="22" fill="#0ea5e9"/><text x="715" y="155" text-anchor="middle">0</text>
    <rect x="728" y="140" width="22" height="22" fill="#0ea5e9"/><text x="739" y="155" text-anchor="middle">3</text>
    <rect x="752" y="140" width="22" height="22" fill="#67e8f9"/><text x="763" y="155" text-anchor="middle">2</text>
  </g>
  <path d="M691 138 C 700 110, 750 110, 763 138" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#pga-swap)"/>
  <path d="M763 165 C 750 190, 700 190, 691 165" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#pga-swap)"/>
  <text x="735" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Swap two positions with</text>
  <text x="735" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">probability mutation_rate</text>

  <!-- ============ Panel 4: fill + repeat ============ -->
  <g font-size="12" fill="#ffffff" font-weight="600">
    <rect x="960" y="100" width="22" height="22" fill="#f59e0b"/><text x="971" y="115" text-anchor="middle">2</text>
    <rect x="984" y="100" width="22" height="22" fill="#f59e0b"/><text x="995" y="115" text-anchor="middle">0</text>
    <rect x="1008" y="100" width="22" height="22" fill="#f59e0b"/><text x="1019" y="115" text-anchor="middle">3</text>
    <rect x="1032" y="100" width="22" height="22" fill="#f59e0b"/><text x="1043" y="115" text-anchor="middle">1</text>
    <text x="1060" y="115" font-size="11" fill="#f59e0b" font-weight="600">elite</text>

    <rect x="960" y="140" width="22" height="22" fill="#67e8f9"/><text x="971" y="155" text-anchor="middle">1</text>
    <rect x="984" y="140" width="22" height="22" fill="#0ea5e9"/><text x="995" y="155" text-anchor="middle">0</text>
    <rect x="1008" y="140" width="22" height="22" fill="#0ea5e9"/><text x="1019" y="155" text-anchor="middle">3</text>
    <rect x="1032" y="140" width="22" height="22" fill="#67e8f9"/><text x="1043" y="155" text-anchor="middle">2</text>

    <rect x="960" y="180" width="22" height="22" fill="#c9cdd3"/><text x="971" y="195" text-anchor="middle" fill="#6b7280">0</text>
    <rect x="984" y="180" width="22" height="22" fill="#c9cdd3"/><text x="995" y="195" text-anchor="middle" fill="#6b7280">2</text>
    <rect x="1008" y="180" width="22" height="22" fill="#c9cdd3"/><text x="1019" y="195" text-anchor="middle" fill="#6b7280">1</text>
    <rect x="1032" y="180" width="22" height="22" fill="#c9cdd3"/><text x="1043" y="195" text-anchor="middle" fill="#6b7280">3</text>
  </g>
  <text x="1025" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Repeat step 2 – 3 until the next</text>
  <text x="1025" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">generation is full</text>

  <path d="M890 350 C 700 400, 500 400, 300 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#pga-step)"/>
  <text x="595" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 4 for n_iterations</text>
</svg>
