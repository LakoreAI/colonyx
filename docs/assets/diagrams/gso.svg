<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="gso-move" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0ea5e9"/>
    </marker>
    <marker id="gso-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="300" rx="10"/>
    <rect x="360" y="20" width="280" height="300" rx="10"/>
    <rect x="700" y="20" width="280" height="300" rx="10"/>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="380" cy="40" r="12" fill="#0ea5e9"/><text x="380" y="45" text-anchor="middle">2</text>
    <circle cx="720" cy="40" r="12" fill="#0ea5e9"/><text x="720" y="45" text-anchor="middle">3</text>
  </g>

  <!-- inter-panel arrows -->
  <line x1="300" y1="170" x2="358" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#gso-step)"/>
  <line x1="640" y1="170" x2="698" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#gso-step)"/>

  <!-- ============ Panel 1: update luciferin ============ -->
  <g>
    <circle cx="80" cy="120" r="7" fill="#0c4a6e"/>
    <circle cx="150" cy="90" r="6" fill="#67e8f9"/>
    <circle cx="220" cy="140" r="5" fill="#a5f3fc"/>
    <circle cx="100" cy="200" r="5" fill="#a5f3fc"/>
    <circle cx="190" cy="230" r="6" fill="#67e8f9"/>
    <circle cx="60" cy="250" r="5" fill="#a5f3fc"/>
    <text x="160" y="270" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">ℓ ← (1−ρ)ℓ + γ/(s+1)</text>
    <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Every glowworm's luciferin</text>
    <text x="160" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">tracks how good it is right now</text>
  </g>

  <!-- ============ Panel 2: local, radius-limited move ============ -->
  <g>
    <!-- worm A: has a brighter neighbor in range -->
    <circle cx="440" cy="180" r="45" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="3 3"/>
    <circle cx="440" cy="180" r="6" fill="#a5f3fc"/>
    <circle cx="465" cy="150" r="7" fill="#0c4a6e"/>
    <line x1="440" y1="180" x2="458" y2="156" stroke="#0ea5e9" stroke-width="2" marker-end="url(#gso-move)"/>
    <text x="440" y="245" text-anchor="middle" font-size="11" fill="#6b7280">brighter neighbor in range</text>
    <text x="440" y="259" text-anchor="middle" font-size="11" fill="#6b7280">→ move toward it, if it helps</text>

    <!-- worm B: no brighter neighbor within radius -->
    <circle cx="565" cy="120" r="34" fill="none" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="3 3"/>
    <circle cx="565" cy="120" r="6" fill="#67e8f9"/>
    <text x="565" y="55" text-anchor="middle" font-size="11" fill="#6b7280">no brighter neighbor</text>
    <text x="565" y="68" text-anchor="middle" font-size="11" fill="#6b7280">in range → holds still</text>

    <text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Radius-limited: distant worms</text>
    <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">can't see or attract each other</text>
  </g>

  <!-- ============ Panel 3: subgroups + repeat ============ -->
  <g>
    <path d="M780 100 l5 11 12 2 -9 8 2 12 -10 -6 -10 6 2 -12 -9 -8 12 -2 z" fill="#f59e0b"/>
    <circle cx="760" cy="130" r="6" fill="#0ea5e9"/>
    <circle cx="800" cy="140" r="6" fill="#0ea5e9"/>
    <circle cx="775" cy="155" r="6" fill="#0ea5e9"/>
    <path d="M930 210 l5 11 12 2 -9 8 2 12 -10 -6 -10 6 2 -12 -9 -8 12 -2 z" fill="#f59e0b" opacity="0.55"/>
    <circle cx="905" cy="235" r="6" fill="#0ea5e9" opacity="0.7"/>
    <circle cx="940" cy="245" r="6" fill="#0ea5e9" opacity="0.7"/>
    <circle cx="915" cy="255" r="6" fill="#0ea5e9" opacity="0.7"/>
    <text x="840" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Separate subgroups can each</text>
    <text x="840" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">converge on their own optimum</text>
  </g>

  <!-- repeat loop -->
  <path d="M700 350 C 550 400, 450 400, 300 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#gso-step)"/>
  <text x="500" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 2 for n_iterations, tracking the best worm seen</text>
</svg>
