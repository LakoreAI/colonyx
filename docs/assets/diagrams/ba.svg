<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ba-move" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0ea5e9"/>
    </marker>
    <marker id="ba-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="300" rx="10"/>
    <rect x="360" y="20" width="280" height="300" rx="10"/>
    <rect x="700" y="20" width="280" height="300" rx="10"/>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="380" cy="40" r="12" fill="#0ea5e9"/><text x="380" y="45" text-anchor="middle">2</text>
    <circle cx="720" cy="40" r="12" fill="#0ea5e9"/><text x="720" y="45" text-anchor="middle">3</text>
  </g>

  <!-- inter-panel arrows -->
  <line x1="300" y1="170" x2="358" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#ba-step)"/>
  <line x1="640" y1="170" x2="698" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#ba-step)"/>

  <!-- ============ Panel 1: fly toward best, or walk near it ============ -->
  <g>
    <path d="M255 75 l5 12 13 2 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -2 z" fill="#f59e0b"/>
    <circle cx="70" cy="220" r="7" fill="#0ea5e9"/>
    <line x1="70" y1="220" x2="175" y2="140" stroke="#0ea5e9" stroke-width="2.2" marker-end="url(#ba-move)"/>
    <text x="122" y="165" text-anchor="middle" font-size="11" fill="#6b7280">freq f</text>
    <line x1="70" y1="220" x2="115" y2="252" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#ba-step)"/>
    <text x="118" y="270" font-size="11" fill="#6b7280">or: walk near best</text>
    <text x="42" y="240" font-size="11" fill="#6b7280">or</text>
    <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Fly toward best at a random</text>
    <text x="160" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">frequency, or walk near it</text>
  </g>

  <!-- ============ Panel 2: accept + adapt ============ -->
  <g>
    <path d="M595 75 l5 12 13 2 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -2 z" fill="#f59e0b"/>
    <circle cx="480" cy="170" r="7" fill="#0ea5e9" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="480" y1="170" x2="580" y2="95" stroke="#0ea5e9" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#ba-move)"/>
    <text x="500" y="215" font-size="11.5" fill="#6b7280">accept if score improves &amp;</text>
    <text x="500" y="230" font-size="11.5" fill="#6b7280">rand() &lt; loudness</text>
    <text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">On accept: loudness ×= α,</text>
    <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">pulse rate rises via γ</text>
  </g>

  <!-- ============ Panel 3: converge + repeat ============ -->
  <g>
    <path d="M935 90 l5 12 13 2 -10 9 3 13 -11 -7 -11 7 3 -13 -10 -9 13 -2 z" fill="#f59e0b"/>
    <circle cx="880" cy="115" r="6" fill="#0ea5e9"/>
    <circle cx="895" cy="150" r="6" fill="#0ea5e9"/>
    <circle cx="860" cy="150" r="6" fill="#0ea5e9"/>
    <circle cx="905" cy="120" r="6" fill="#0ea5e9"/>
    <circle cx="870" cy="130" r="6" fill="#0ea5e9"/>
    <circle cx="915" cy="140" r="6" fill="#0ea5e9"/>
    <text x="840" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Swarm converges on the</text>
    <text x="840" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">quietest, most confident bats</text>
  </g>

  <!-- repeat loop -->
  <path d="M700 350 C 550 400, 450 400, 300 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#ba-step)"/>
  <text x="500" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 3 for n_iterations</text>
</svg>
