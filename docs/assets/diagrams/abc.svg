<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 430" width="1340" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="abc-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
    <marker id="abc-move" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="300" rx="10"/>
    <rect x="360" y="20" width="280" height="300" rx="10"/>
    <rect x="700" y="20" width="280" height="300" rx="10"/>
    <rect x="1040" y="20" width="280" height="300" rx="10"/>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="380" cy="40" r="12" fill="#0ea5e9"/><text x="380" y="45" text-anchor="middle">2</text>
    <circle cx="720" cy="40" r="12" fill="#0ea5e9"/><text x="720" y="45" text-anchor="middle">3</text>
    <circle cx="1060" cy="40" r="12" fill="#0ea5e9"/><text x="1060" y="45" text-anchor="middle">4</text>
  </g>

  <!-- inter-panel arrows -->
  <line x1="300" y1="170" x2="358" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#abc-step)"/>
  <line x1="640" y1="170" x2="698" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#abc-step)"/>
  <line x1="980" y1="170" x2="1038" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#abc-step)"/>

  <!-- ============ Panel 1: employed bees exploit ============ -->
  <g>
    <circle cx="60" cy="230" r="5" fill="#a5f3fc"/>
    <circle cx="230" cy="110" r="5" fill="#a5f3fc"/>
    <circle cx="90" cy="170" r="8" fill="#0ea5e9"/>
    <circle cx="140" cy="140" r="6" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="97" y1="164" x2="132" y2="145" stroke="#0ea5e9" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#abc-move)"/>
    <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Employed bees explore</text>
    <text x="160" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">near their own source</text>
  </g>

  <!-- ============ Panel 2: onlooker roulette selection ============ -->
  <g>
    <circle cx="420" cy="220" r="5" fill="#a5f3fc"/>
    <circle cx="480" cy="150" r="7" fill="#0ea5e9"/>
    <circle cx="545" cy="195" r="10" fill="#0ea5e9"/>
    <circle cx="545" cy="195" r="17" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Onlooker bees pick sources</text>
    <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">by roulette wheel: bigger = fitter</text>
  </g>

  <!-- ============ Panel 3: scout abandons the stagnant source ============ -->
  <g>
    <circle cx="760" cy="190" r="8" fill="#a5f3fc"/>
    <text x="760" y="217" text-anchor="middle" font-size="10.5" fill="#9ca3af">trials &gt; limit</text>
    <circle cx="870" cy="130" r="7" fill="#0ea5e9"/>
    <path d="M772 178 Q 815 130 858 133" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="3 3" marker-end="url(#abc-move)"/>
    <text x="840" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Most-stagnant source restarts</text>
    <text x="840" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">at a fresh random position</text>
  </g>

  <!-- ============ Panel 4: track best + repeat ============ -->
  <g>
    <circle cx="1090" cy="150" r="5" fill="#a5f3fc"/>
    <circle cx="1150" cy="205" r="6" fill="#0ea5e9"/>
    <circle cx="1255" cy="185" r="5" fill="#a5f3fc"/>
    <circle cx="1200" cy="140" r="9" fill="#f59e0b"/>
    <text x="1180" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Track the best source found</text>
    <text x="1180" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">so far (amber); repeat</text>
  </g>

  <!-- repeat loop -->
  <path d="M1180 350 C 900 405, 400 405, 160 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#abc-step)"/>
  <text x="670" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 4 for n_iterations</text>
</svg>
