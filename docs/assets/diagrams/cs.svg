<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="cs-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
    <marker id="cs-move" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="300" rx="10"/>
    <rect x="360" y="20" width="280" height="300" rx="10"/>
    <rect x="700" y="20" width="280" height="300" rx="10"/>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="380" cy="40" r="12" fill="#0ea5e9"/><text x="380" y="45" text-anchor="middle">2</text>
    <circle cx="720" cy="40" r="12" fill="#0ea5e9"/><text x="720" y="45" text-anchor="middle">3</text>
  </g>

  <!-- inter-panel arrows -->
  <line x1="300" y1="170" x2="358" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#cs-step)"/>
  <line x1="640" y1="170" x2="698" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#cs-step)"/>

  <!-- ============ Panel 1: Lévy step per nest ============ -->
  <g>
    <circle cx="90" cy="200" r="6" fill="#0ea5e9"/>
    <circle cx="150" cy="120" r="5" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="2 2"/>
    <path d="M97 192 Q 120 140 143 124" fill="none" stroke="#0ea5e9" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#cs-move)"/>
    <circle cx="210" cy="230" r="6" fill="#0ea5e9"/>
    <circle cx="218" cy="215" r="5" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="2 2"/>
    <circle cx="60" cy="110" r="5" fill="#a5f3fc"/>
    <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Each nest takes a Lévy step,</text>
    <text x="160" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">kept only if it scores better</text>
  </g>

  <!-- ============ Panel 2: abandon the worst pa-fraction ============ -->
  <g>
    <circle cx="420" cy="230" r="6" fill="#c9cdd3"/>
    <circle cx="460" cy="245" r="6" fill="#c9cdd3"/>
    <path d="M420 230 Q 500 130 560 110" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#cs-move)"/>
    <path d="M460 245 Q 520 160 575 150" fill="none" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#cs-move)"/>
    <circle cx="565" cy="105" r="6" fill="#0ea5e9"/>
    <circle cx="580" cy="145" r="6" fill="#0ea5e9"/>
    <circle cx="490" cy="180" r="6" fill="#0ea5e9"/>
    <text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Worst pa-fraction of nests are</text>
    <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">abandoned to fresh random spots</text>
  </g>

  <!-- ============ Panel 3: track best + repeat ============ -->
  <g>
    <circle cx="880" cy="220" r="6" fill="#0ea5e9"/>
    <circle cx="920" cy="130" r="6" fill="#0ea5e9"/>
    <circle cx="800" cy="150" r="6" fill="#0ea5e9"/>
    <circle cx="845" cy="185" r="9" fill="#f59e0b"/>
    <text x="840" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Track the best nest found</text>
    <text x="840" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">so far (amber); repeat</text>
  </g>

  <!-- repeat loop -->
  <path d="M700 350 C 550 400, 450 400, 300 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#cs-step)"/>
  <text x="500" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 3 for n_iterations</text>
</svg>
