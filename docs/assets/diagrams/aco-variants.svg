<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="220" height="300" rx="10"/>
    <rect x="260" y="20" width="220" height="300" rx="10"/>
    <rect x="500" y="20" width="220" height="300" rx="10"/>
    <rect x="740" y="20" width="220" height="300" rx="10"/>
  </g>

  <!-- variant badges (pills, not numbers — this is a comparison, not a sequence) -->
  <g font-size="11.5" font-weight="700" fill="#ffffff">
    <rect x="20" y="26" width="60" height="22" rx="11" fill="#0ea5e9"/><text x="50" y="41" text-anchor="middle">basic</text>
    <rect x="260" y="26" width="66" height="22" rx="11" fill="#0ea5e9"/><text x="293" y="41" text-anchor="middle">elitist</text>
    <rect x="500" y="26" width="50" height="22" rx="11" fill="#0ea5e9"/><text x="525" y="41" text-anchor="middle">acs</text>
    <rect x="740" y="26" width="58" height="22" rx="11" fill="#0ea5e9"/><text x="769" y="41" text-anchor="middle">mmas</text>
  </g>

  <!-- ============ basic: every ant deposits on its own tour ============ -->
  <g>
    <circle cx="55" cy="170" r="16" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="55" y="200" text-anchor="middle" font-size="10.5" fill="#6b7280">nest</text>
    <circle cx="205" cy="170" r="16" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="205" y="200" text-anchor="middle" font-size="10.5" fill="#6b7280">food</text>
    <path d="M73 160 Q 130 115 187 160" fill="none" stroke="#0ea5e9" stroke-width="3.5"/>
    <path d="M73 180 Q 130 225 187 180" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  </g>
  <text x="130" y="255" text-anchor="middle" font-size="11.5" fill="#6b7280">Every ant deposits on</text>
  <text x="130" y="271" text-anchor="middle" font-size="11.5" fill="#6b7280">its own tour each round</text>

  <!-- ============ elitist: basic + best-so-far bonus ============ -->
  <g>
    <circle cx="295" cy="170" r="16" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="295" y="200" text-anchor="middle" font-size="10.5" fill="#6b7280">nest</text>
    <circle cx="445" cy="170" r="16" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="445" y="200" text-anchor="middle" font-size="10.5" fill="#6b7280">food</text>
    <path d="M313 160 Q 370 115 427 160" fill="none" stroke="#f59e0b" stroke-width="4.5"/>
    <path d="M313 180 Q 370 225 427 180" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  </g>
  <text x="370" y="255" text-anchor="middle" font-size="11.5" fill="#6b7280">+ extra deposit from the</text>
  <text x="370" y="271" text-anchor="middle" font-size="11.5" fill="#6b7280">best-so-far tour (amber)</text>

  <!-- ============ acs: only best-so-far deposits, greedy choice ============ -->
  <g>
    <circle cx="535" cy="170" r="16" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="535" y="200" text-anchor="middle" font-size="10.5" fill="#6b7280">nest</text>
    <circle cx="685" cy="170" r="16" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="685" y="200" text-anchor="middle" font-size="10.5" fill="#6b7280">food</text>
    <path d="M553 160 Q 610 115 667 160" fill="none" stroke="#f59e0b" stroke-width="4.5"/>
    <path d="M553 180 Q 610 225 667 180" fill="none" stroke="#c9cdd3" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  </g>
  <text x="610" y="240" text-anchor="middle" font-size="10.5" fill="#6b7280">greedy w.p. q0</text>
  <text x="610" y="255" text-anchor="middle" font-size="11.5" fill="#6b7280">Only the best-so-far ant</text>
  <text x="610" y="271" text-anchor="middle" font-size="11.5" fill="#6b7280">deposits; others don't</text>

  <!-- ============ mmas: elitist deposits + pheromone clamp ============ -->
  <g>
    <circle cx="775" cy="170" r="16" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="775" y="200" text-anchor="middle" font-size="10.5" fill="#6b7280">nest</text>
    <circle cx="925" cy="170" r="16" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="925" y="200" text-anchor="middle" font-size="10.5" fill="#6b7280">food</text>
    <path d="M793 160 Q 850 115 907 160" fill="none" stroke="#f59e0b" stroke-width="4.5"/>
    <path d="M793 180 Q 850 225 907 180" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  </g>
  <text x="850" y="240" text-anchor="middle" font-size="10.5" fill="#6b7280">clamped to [τ_min, τ_max]</text>
  <text x="850" y="255" text-anchor="middle" font-size="11.5" fill="#6b7280">Same deposits as elitist,</text>
  <text x="850" y="271" text-anchor="middle" font-size="11.5" fill="#6b7280">pheromone growth is bounded</text>

  <!-- unifying footer -->
  <text x="500" y="365" text-anchor="middle" font-size="13" fill="#6b7280">All four share the same construction + evaporation loop as basic ACO —</text>
  <text x="500" y="384" text-anchor="middle" font-size="13" fill="#6b7280">they differ only in who deposits pheromone and how a city is chosen.</text>
</svg>
