<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" width="1300" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="cma-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
    <marker id="cma-path" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="270" height="300" rx="10"/>
    <rect x="310" y="20" width="270" height="300" rx="10"/>
    <rect x="600" y="20" width="270" height="300" rx="10"/>
    <rect x="890" y="20" width="270" height="300" rx="10"/>
  </g>

  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="330" cy="40" r="12" fill="#0ea5e9"/><text x="330" y="45" text-anchor="middle">2</text>
    <circle cx="620" cy="40" r="12" fill="#0ea5e9"/><text x="620" y="45" text-anchor="middle">3</text>
    <circle cx="910" cy="40" r="12" fill="#0ea5e9"/><text x="910" y="45" text-anchor="middle">4</text>
  </g>

  <line x1="290" y1="170" x2="308" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#cma-step)"/>
  <line x1="580" y1="170" x2="598" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#cma-step)"/>
  <line x1="870" y1="170" x2="888" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#cma-step)"/>

  <!-- ============ Panel 1: sample ============ -->
  <g>
    <ellipse cx="155" cy="160" rx="85" ry="55" fill="none" stroke="#a5f3fc" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="150" y="155" width="10" height="10" fill="none" stroke="#6b7280" stroke-width="2"/>
    <text x="155" y="145" text-anchor="middle" font-size="11" fill="#6b7280">mean</text>
    <circle cx="110" cy="130" r="5" fill="#0ea5e9"/>
    <circle cx="190" cy="120" r="5" fill="#0ea5e9"/>
    <circle cx="215" cy="170" r="5" fill="#0ea5e9"/>
    <circle cx="175" cy="195" r="5" fill="#0ea5e9"/>
    <circle cx="105" cy="185" r="5" fill="#0ea5e9"/>
    <circle cx="130" cy="150" r="5" fill="#0ea5e9"/>
    <circle cx="200" cy="150" r="5" fill="#0ea5e9"/>
    <text x="155" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Sample the generation from</text>
    <text x="155" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">N(mean, σ² · diag(C))</text>
  </g>

  <!-- ============ Panel 2: select + recombine mean ============ -->
  <g>
    <circle cx="400" cy="130" r="6" fill="#0ea5e9"/>
    <circle cx="480" cy="120" r="6" fill="#0ea5e9"/>
    <circle cx="505" cy="170" r="6" fill="#0ea5e9"/>
    <circle cx="465" cy="195" r="6" fill="#0ea5e9"/>
    <circle cx="395" cy="185" r="5" fill="#c9cdd3"/>
    <circle cx="420" cy="150" r="5" fill="#c9cdd3"/>
    <circle cx="490" cy="150" r="5" fill="#c9cdd3"/>
    <line x1="400" y1="130" x2="450" y2="160" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="480" y1="120" x2="450" y2="160" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="505" y1="170" x2="450" y2="160" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="465" y1="195" x2="450" y2="160" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="445" y="155" width="10" height="10" fill="#f59e0b"/>
    <text x="450" y="145" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="600">new mean</text>
    <text x="445" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Rank the generation; new mean =</text>
    <text x="445" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">weighted average of the best μ</text>
  </g>

  <!-- ============ Panel 3: adapt step-size ============ -->
  <g>
    <rect x="680" y="195" width="10" height="10" fill="none" stroke="#c9cdd3" stroke-width="2"/>
    <text x="665" y="220" text-anchor="middle" font-size="11" fill="#c9cdd3">old mean</text>
    <rect x="745" y="130" width="10" height="10" fill="#f59e0b"/>
    <text x="750" y="115" text-anchor="middle" font-size="11" fill="#f59e0b" font-weight="600">new mean</text>
    <line x1="685" y1="200" x2="748" y2="138" stroke="#f59e0b" stroke-width="2" marker-end="url(#cma-path)"/>
    <text x="720" y="175" text-anchor="middle" font-size="11" fill="#f59e0b" font-style="italic">p_σ</text>
    <circle cx="750" cy="135" r="45" fill="none" stroke="#a5f3fc" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="750" cy="135" r="65" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="735" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Evolution path p_σ tracks the</text>
    <text x="735" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">move; σ grows or shrinks to match</text>
  </g>

  <!-- ============ Panel 4: adapt covariance ============ -->
  <g>
    <ellipse cx="1025" cy="160" rx="110" ry="45" fill="none" stroke="#0ea5e9" stroke-width="1.5"/>
    <rect x="1020" y="155" width="10" height="10" fill="#f59e0b"/>
    <circle cx="960" cy="150" r="5" fill="#0ea5e9"/>
    <circle cx="1000" cy="130" r="5" fill="#0ea5e9"/>
    <circle cx="1060" cy="135" r="5" fill="#0ea5e9"/>
    <circle cx="1095" cy="165" r="5" fill="#0ea5e9"/>
    <circle cx="1040" cy="185" r="5" fill="#0ea5e9"/>
    <text x="1025" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Each axis's variance is reset from</text>
    <text x="1025" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">the best μ's spread; repeat</text>
  </g>

  <path d="M890 350 C 700 400, 500 400, 300 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#cma-step)"/>
  <text x="595" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 4 for n_iterations</text>
</svg>
