<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="mopso-step" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
    <marker id="mopso-a-leader" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
    <marker id="mopso-a-personal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0ea5e9"/>
    </marker>
    <marker id="mopso-a-vel" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- panel frames -->
  <g fill="none" stroke="#9ca3af" stroke-width="1.5">
    <rect x="20" y="20" width="280" height="300" rx="10"/>
    <rect x="360" y="20" width="280" height="300" rx="10"/>
    <rect x="700" y="20" width="280" height="300" rx="10"/>
  </g>

  <!-- step badges -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <circle cx="40" cy="40" r="12" fill="#0ea5e9"/><text x="40" y="45" text-anchor="middle">1</text>
    <circle cx="380" cy="40" r="12" fill="#0ea5e9"/><text x="380" y="45" text-anchor="middle">2</text>
    <circle cx="720" cy="40" r="12" fill="#0ea5e9"/><text x="720" y="45" text-anchor="middle">3</text>
  </g>

  <!-- inter-panel arrows -->
  <line x1="300" y1="170" x2="358" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#mopso-step)"/>
  <line x1="640" y1="170" x2="698" y2="170" stroke="#9ca3af" stroke-width="2" marker-end="url(#mopso-step)"/>

  <!-- ============ Panel 1: draw a leader from the archive ============ -->
  <g>
    <circle cx="120" cy="90" r="6" fill="#f59e0b"/>
    <circle cx="160" cy="75" r="6" fill="#f59e0b"/>
    <circle cx="200" cy="95" r="6" fill="#f59e0b"/>
    <circle cx="235" cy="120" r="6" fill="#f59e0b"/>
    <circle cx="90" cy="120" r="6" fill="#f59e0b"/>
    <path d="M90 120 Q 160 145 235 120" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
    <text x="160" y="60" text-anchor="middle" font-size="11.5" fill="#f59e0b">archive (non-dominated)</text>
    <circle cx="90" cy="230" r="7" fill="#0ea5e9"/>
    <text x="90" y="252" text-anchor="middle" font-size="11" fill="#6b7280">particle</text>
    <line x1="97" y1="223" x2="150" y2="90" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="3 3" marker-end="url(#mopso-a-leader)"/>
    <text x="185" y="150" text-anchor="middle" font-size="11" fill="#f59e0b">leader ℓ</text>
  </g>
  <text x="160" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Draw a random leader from</text>
  <text x="160" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">the archive's non-dominated front</text>

  <!-- ============ Panel 2: velocity/position update ============ -->
  <g>
    <circle cx="590" cy="90" r="6" fill="#f59e0b"/>
    <text x="590" y="75" text-anchor="middle" font-size="11" fill="#f59e0b">leader ℓ</text>
    <rect x="425" y="215" width="9" height="9" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <text x="430" y="242" text-anchor="middle" font-size="10.5" fill="#0ea5e9">pbest</text>
    <line x1="480" y1="170" x2="433" y2="213" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#mopso-a-personal)"/>
    <line x1="480" y1="170" x2="585" y2="97" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#mopso-a-leader)"/>
    <line x1="480" y1="170" x2="525" y2="145" stroke="#6b7280" stroke-width="2.5" marker-end="url(#mopso-a-vel)"/>
    <circle cx="480" cy="170" r="7" fill="#0ea5e9"/>
  </g>
  <text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Update velocity toward personal</text>
  <text x="500" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">best and the leader; move</text>

  <!-- ============ Panel 3: dominance check + archive rebuild ============ -->
  <g>
    <circle cx="800" cy="150" r="7" fill="#0ea5e9"/>
    <text x="800" y="128" text-anchor="middle" font-size="10.5" fill="#0ea5e9">new x</text>
    <path d="M812 150 L845 150" stroke="#6b7280" stroke-width="1.6" marker-end="url(#mopso-a-vel)"/>
    <text x="828" y="172" text-anchor="middle" font-size="10" fill="#6b7280">dominates?</text>
    <rect x="850" y="145" width="9" height="9" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="900" cy="95" r="6" fill="#f59e0b"/>
    <circle cx="935" cy="80" r="6" fill="#f59e0b"/>
    <circle cx="960" cy="105" r="6" fill="#f59e0b"/>
    <circle cx="915" cy="120" r="6" fill="#f59e0b"/>
    <circle cx="880" cy="200" r="5" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="925" y="230" text-anchor="middle" font-size="11" fill="#6b7280">archive rebuilt</text>
  </g>
  <text x="840" y="290" text-anchor="middle" font-size="12.5" fill="#6b7280">Keep new x only if it dominates</text>
  <text x="840" y="306" text-anchor="middle" font-size="12.5" fill="#6b7280">pbest; rebuild the archive</text>

  <!-- repeat loop -->
  <path d="M700 350 C 550 400, 450 400, 300 350" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="2 5" marker-end="url(#mopso-step)"/>
  <text x="500" y="415" text-anchor="middle" font-size="13" fill="#6b7280">repeat steps 1 – 3 for n_iterations</text>
</svg>
