<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" aria-labelledby="title desc" role="img">
  <title id="title">Colonyx Logo</title>
  <desc id="desc">A honeycomb of six colony cells surrounding a bright central cell — the colony's agents converging on the solution they found together</desc>

  <defs>
    <radialGradient id="core" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="55%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <linearGradient id="cell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <!-- Six colony cells in a true edge-sharing honeycomb ring -->
  <g fill="url(#cell)" stroke="#0C4A6E" stroke-width="2" stroke-linejoin="round">
    <polygon points="145.03,74.00 167.55,87.00 167.55,113.00 145.03,126.00 122.52,113.00 122.52,87.00"/>
    <polygon points="122.52,113.00 145.03,126.00 145.03,152.00 122.52,165.00 100.00,152.00 100.00,126.00"/>
    <polygon points="77.48,113.00 100.00,126.00 100.00,152.00 77.48,165.00 54.97,152.00 54.97,126.00"/>
    <polygon points="54.97,74.00 77.48,87.00 77.48,113.00 54.97,126.00 32.45,113.00 32.45,87.00"/>
    <polygon points="77.48,35.00 100.00,48.00 100.00,74.00 77.48,87.00 54.97,74.00 54.97,48.00"/>
    <polygon points="122.52,35.00 145.03,48.00 145.03,74.00 122.52,87.00 100.00,74.00 100.00,48.00"/>
  </g>

  <!-- Each cell holds a colony member -->
  <g fill="#0C4A6E" fill-opacity="0.45">
    <circle cx="145.03" cy="100.00" r="3.2"/>
    <circle cx="122.52" cy="139.00" r="3.2"/>
    <circle cx="77.48"  cy="139.00" r="3.2"/>
    <circle cx="54.97"  cy="100.00" r="3.2"/>
    <circle cx="77.48"  cy="61.00"  r="3.2"/>
    <circle cx="122.52" cy="61.00"  r="3.2"/>
  </g>

  <!-- The solution the colony converged on -->
  <polygon points="100.00,74.00 122.52,87.00 122.52,113.00 100.00,126.00 77.48,113.00 77.48,87.00"
           fill="url(#core)" stroke="#0C4A6E" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
