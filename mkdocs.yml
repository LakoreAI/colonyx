site_name: colonyx
site_description: "A Pythonic toolkit for swarm intelligence optimization — Rust-fast, scikit-learn compatible."
site_url: https://lakoreai.github.io/colonyx/
repo_url: https://github.com/LakoreAI/colonyx
repo_name: LakoreAI/colonyx
edit_uri: edit/main/docs/

theme:
  name: material
  logo: colonyx-logo.svg
  favicon: colonyx-logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - meta
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/colonyx/
    - icon: fontawesome/brands/github
      link: https://github.com/LakoreAI/colonyx

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Examples & Gallery: examples.md
  - Algorithms:
      - Overview: algorithms.md
      - Ant Colony Optimization (ACO): algorithms/aco.md
      - Particle Swarm Optimization (PSO): algorithms/pso.md
      - Artificial Bee Colony (ABC): algorithms/abc.md
      - Grey Wolf Optimizer (GWO): algorithms/gwo.md
      - Firefly Algorithm (FA): algorithms/fa.md
      - Simulated Annealing (SA): algorithms/sa.md
      - Cuckoo Search (CS): algorithms/cs.md
      - Bat Algorithm (BA): algorithms/ba.md
      - Glowworm Swarm Optimization (GSO): algorithms/gso.md
      - Bacterial Foraging Optimization (BFO): algorithms/bfo.md
      - Differential Evolution (DE): algorithms/de.md
      - Covariance Matrix Adaptation Evolution Strategy (CMA-ES): algorithms/cmaes.md
      - Advanced:
          - Overview: algorithms/advanced.md
          - Permutation Genetic Algorithm (Permutation GA): algorithms/permutation-ga.md
          - Binary Particle Swarm Optimization (Binary PSO): algorithms/binary-pso.md
          - Non-dominated Sorting Genetic Algorithm II (NSGA-II): algorithms/nsga2.md
          - Multi-Objective Particle Swarm Optimization (MOPSO): algorithms/mopso.md
          - ACO Variants (Elitist, ACS, MMAS): algorithms/aco-variants.md
  - Features:
      - AutoColony API: autocolony-api.md
      - CLI: cli.md
      - Benchmarking & Metrics: benchmarking.md
      - Rust Usage: rust.md
  - API Reference: api.md
  - Release: release.md
